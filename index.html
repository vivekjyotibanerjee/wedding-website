<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Fixed WebGL layer, with a soft vignette over it -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="vignette" aria-hidden="true"></div>

    <!-- Loading veil -->
    <div id="veil"><span class="veil-mark" aria-hidden="true">✦</span><span id="veil-note" class="veil-note" aria-hidden="true"></span><button id="enter" class="btn" type="button" hidden>Enter</button></div>

    <!-- Fixed HUD: sound + day/night toggles, the nav bar -->
    <div id="hud">
      <div class="hud-buttons">
        <button id="night-toggle" type="button" aria-pressed="false" aria-label="Switch to night">
          <span class="icon-sun" aria-hidden="true">☀</span>
          <span class="icon-moon" aria-hidden="true">☾</span>
          <span class="label">Night</span>
        </button>
        <button id="audio-toggle" type="button" aria-pressed="false" aria-label="Turn sound on">
          <span class="audio-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="label">Sound</span>
        </button>
      </div>
      <!-- A jump to each section of the walk (filled by main.js from content.json "nav") -->
      <nav id="nav" aria-label="Sections"></nav>
    </div>

    <!-- The dark a nav jump passes through -->
    <div id="fade" aria-hidden="true"></div>

    <!-- Cards pinned to places in the scene (filled by JS) -->
    <div id="cards" aria-live="polite"></div>

    <!-- Plain-HTML version of the details: shown only when WebGL is unavailable -->
    <main id="details" hidden></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
