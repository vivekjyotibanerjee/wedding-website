<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Wedding</title>
    <meta name="description" content="Walk through a terracotta temple to our wedding — the date, events, travel and RSVP." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Fixed WebGL layer -->
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Loading veil -->
    <div id="veil" aria-hidden="true"><span class="veil-mark">✦</span></div>

    <!-- Fixed HUD: audio toggle + scroll hint -->
    <div id="hud">
      <button id="audio-toggle" type="button" aria-pressed="false" aria-label="Turn ambient sound on">
        <span class="audio-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="audio-label">Sound</span>
      </button>
      <div id="scroll-hint" aria-hidden="true">
        <span></span>
      </div>
    </div>

    <!-- Fixed overlays for each stage of the walk (filled by JS) -->
    <div id="stages" aria-live="polite"></div>

    <!-- Tall spacer that drives the walk -->
    <div id="walk" aria-label="Temple walk"></div>

    <!-- Conventional sections -->
    <main id="details"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
