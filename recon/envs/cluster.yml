# Cluster environment (24/48GB NVIDIA). Create with:
#   conda env create -f envs/cluster.yml && conda activate dak-recon
# Then install the pieces that are not on conda:
#   pip install git+https://github.com/nerfstudio-project/nerfstudio.git   # includes splatfacto / splatfacto-w
#   pip install git+https://github.com/IDEA-Research/Grounded-SAM-2.git    # masks (02_mask.py)
#   npm i -g @playcanvas/splat-transform                                    # SOGS compression (06_compress.sh)
name: dak-recon
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.4.*
  - pytorch-cuda=12.1
  - torchvision
  - colmap            # check the conda-forge build variant has CUDA; if not, set --SiftExtraction.use_gpu 0 in 03_sfm.sh
  - ffmpeg
  - nodejs
  - pip
  - pip:
      - requests>=2.31
      - pyyaml>=6.0
      - pillow>=10.0
      - tqdm>=4.66
      - yt-dlp>=2024.8.6
      - opencv-python-headless
      - numpy
      - imagehash
      - plyfile
      - transformers
      - accelerate
