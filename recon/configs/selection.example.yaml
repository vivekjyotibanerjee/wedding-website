# Example of the audit output. The real file is configs/selection.yaml — produced by the audit page
# (scripts/laptop/audit.py → "Copy selection.yaml") and committed from the laptop. Only ids listed
# in configs/manifest.json are meaningful here.
commons:
  include:            # ids or globs; "all" selects everything in the manifest
    - M12345678   # facade
    - M23456789   # courtyard
  exclude: []         # ids or globs removed after include (e.g. a bad batch "M99*")
  buckets:            # optional labels used for coverage counts and the pilot subset
    M12345678: facade
    M23456789: courtyard
youtube:
  dQw4w9WgXcQ: [["01:20", "02:45"], ["05:00", "05:30"]]   # only these time ranges are frame-extracted
  abcdefghijk: all                                        # whole video
