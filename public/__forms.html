<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RSVP</title><meta name="robots" content="noindex"></head>
<body>
  <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="rsvp">
    <input name="bot-field">
    <input name="name" type="text">
    <input name="email" type="email">
    <input name="guests" type="number">
    <input name="attending">
    <input name="shuttle">
    <input name="events">
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
